# yaml-language-server: $schema=https://raw.githubusercontent.com/mfontanini/presenterm/master/config-file-schema.json
defaults:
  # Always use kitty until Ghostty detection is released
  image_protocol: kitty-local

snippet:
  exec:
    enable: true
    custom:
      zig:
        filename: snippet.zig
        hidden_line_prefix: "/// "
        commands:
          - ["zig", "run", "$pwd/snippet.zig"]
